<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Descargar App TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at center, #111, #000);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      max-width: 400px;
      padding: 30px;
      background: rgba(255,255,255,0.05);
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,255,200,0.2);
      backdrop-filter: blur(10px);
    }

    h1 {
      color: #19f0d8;
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #ccc;
      font-size: 14px;
      margin-bottom: 20px;
    }

    a.button {
      display: inline-block;
      padding: 12px 20px;
      background: #19f0d8;
      color: black;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    a.button:hover {
      background: #0fd1c7;
    }

    .small {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>📺 Descargar App TV</h1>

    <p>
      Haz click abajo para descargar e instalar la aplicación en tu Android TV o TV Box.
    </p>

    <!-- ✔ LINK CORRECTO -->
    <a class="button"
       href="./app-release.apk">
      Descargar APK
    </a>

    <div class="small">
      Si usas Android TV, abre este link con Downloader
    </div>
  </div>

</body>
</html>
